<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | StudyHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top">
    <a class="brand" href="index.html">
      Study<span>Hub</span>
    </a>
  </header>

  <main class="wrap">
    <section class="card" style="max-width:540px;margin:auto">

      <div class="eyebrow">Join the community</div>
      <h1>Create your StudyHub account</h1>

      <p class="muted">
        Create an account to access your student dashboard.
      </p>

      <form id="signupForm">

        <div class="field">
          <label for="name">Your display name</label>
          <input
            id="name"
            type="text"
            maxlength="50"
            autocomplete="nickname"
            placeholder="What should we call you?"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Create a password</label>
          <input
            id="password"
            type="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            required
          >
        </div>

        <button class="gold" type="submit">
          Create Account
        </button>

        <p id="signupMessage" role="status"></p>

      </form>

      <p>
        Already have an account?
        <a href="login.html">Log in</a>
      </p>

    </section>
  </main>

  <script type="module" src="auth.js"></script>

</body>
</html>
